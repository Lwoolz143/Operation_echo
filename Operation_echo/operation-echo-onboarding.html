<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Operation Echo — Cinematic Introduction</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
}

body {
  min-height: 100vh;
  overflow: hidden;
  background: #000;
  color: #eee8cf;
  font-family: "Segoe UI", Arial, sans-serif;
}

.scene {
  position: fixed;
  inset: 0;
  overflow: hidden;
  isolation: isolate;

  background:
    radial-gradient(
      circle at 50% 52%,
      rgba(110, 139, 57, 0.13),
      rgba(29, 51, 25, 0.035) 31%,
      transparent 61%
    ),
    #010302;
}

/* Darkens the edges and creates the immense negative space. */

.scene::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 20;
  pointer-events: none;

  background:
    radial-gradient(
      ellipse at 50% 52%,
      transparent 0 22%,
      rgba(0, 0, 0, 0.2) 53%,
      rgba(0, 0, 0, 0.86) 100%
    );
}

/* Stars and firefly-like particles */

.star-field {
  position: absolute;
  inset: 0;
  z-index: 1;
  overflow: hidden;
}

.star {
  position: absolute;
  left: var(--x);
  top: var(--y);
  width: var(--size);
  height: var(--size);
  border-radius: 50%;

  background: rgba(237, 202, 105, 0.9);

  box-shadow:
    0 0 4px rgba(237, 202, 105, 0.75),
    0 0 10px rgba(193, 182, 83, 0.22);

  opacity: 0;

  animation:
    starAppear 4s var(--delay) ease-out forwards,
    starDrift var(--duration) var(--delay) ease-in-out infinite alternate;
}

/* Soft green-yellow illumination behind the emblem */

.emblem-glow {
  position: absolute;
  left: 50%;
  top: 52%;
  z-index: 2;

  width: min(76vw, 780px);
  aspect-ratio: 1;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(219, 221, 116, 0.18) 0%,
      rgba(133, 163, 67, 0.1) 19%,
      rgba(66, 96, 45, 0.04) 42%,
      transparent 72%
    );

  filter: blur(25px);

  opacity: 0;
  transform: translate(-50%, -50%) scale(0.08);

  animation: glowAwaken 15.5s 0.5s ease-out forwards;
}

/* Large circular resonance field */

.resonance-field {
  position: absolute;
  left: 50%;
  top: 52%;
  z-index: 3;

  width: min(88vw, 900px);
  aspect-ratio: 1;

  border-radius: 50%;

  background:
    repeating-radial-gradient(
      circle,
      transparent 0 28px,
      rgba(207, 194, 83, 0.07) 29px,
      transparent 30px 55px
    );

  opacity: 0;
  transform: translate(-50%, -50%) scale(0.16);

  animation:
    resonanceAppear 10s 1s ease-out forwards,
    resonanceBreathe 5.4s 8s ease-in-out infinite alternate;
}

/* A faint second set of rings creates depth. */

.resonance-field::before {
  content: "";
  position: absolute;
  inset: 11%;

  border-radius: 50%;
  border: 1px solid rgba(192, 190, 91, 0.09);

  box-shadow:
    0 0 0 35px rgba(185, 184, 83, 0.025),
    0 0 0 72px rgba(185, 184, 83, 0.02),
    0 0 0 111px rgba(185, 184, 83, 0.016);
}

/* Forest corridor */

.forest {
  position: absolute;
  inset: 0;
  z-index: 8;
  pointer-events: none;
  opacity: 0;

  animation: forestEmerge 8s 0.5s ease-out forwards;
}

.forest-back {
  z-index: 7;
  filter: blur(1.2px);
  opacity: 0;
}

.tree {
  position: absolute;
  bottom: -2%;

  width: var(--width);
  height: var(--height);

  background: var(--tree-color, #000);

  transform:
    translateX(-50%)
    scaleX(var(--lean, 1));

  transform-origin: bottom center;

  clip-path: polygon(
    49% 0%,
    57% 12%,
    53% 12%,
    67% 26%,
    58% 25%,
    75% 42%,
    63% 40%,
    83% 61%,
    61% 56%,
    58% 100%,
    42% 100%,
    39% 56%,
    17% 61%,
    37% 40%,
    25% 42%,
    42% 25%,
    33% 26%,
    47% 12%,
    43% 12%
  );
}

.forest-back .tree {
  --tree-color: #010402;
  opacity: 0.9;

  filter:
    drop-shadow(
      0 -1px 3px rgba(189, 202, 102, 0.035)
    );
}

.forest-front .tree {
  --tree-color: #000;
  opacity: 1;

  filter:
    drop-shadow(
      0 -1px 3px rgba(189, 202, 102, 0.045)
    );
}

/* The logo approaches from deep in the forest. */

.emblem-flight {
  position: absolute;
  left: 50%;
  top: 52%;
  z-index: 6;

  width: clamp(270px, 38vw, 460px);
  aspect-ratio: 1;

  display: grid;
  place-items: center;

  opacity: 0;

  transform:
    translate(-50%, -50%)
    scale(0.035);

  animation:
    emblemApproach 10.6s 0.6s
    cubic-bezier(0.12, 0.56, 0.17, 1)
    forwards;
}

.emblem-pulse {
  position: absolute;
  inset: 0;

  display: grid;
  place-items: center;

  animation:
    emblemPulse 2.15s 10.9s ease-in-out 3;
}

.logo-frame {
  position: relative;

  width: 72%;
  aspect-ratio: 1;

  border-radius: 50%;

  filter:
    brightness(0.84)
    saturate(0.82)
    drop-shadow(
      0 0 10px rgba(211, 202, 100, 0.15)
    );

  animation:
    logoAwaken 10s 0.8s ease-out forwards,
    logoGlowPulse 2.15s 10.9s ease-in-out 3;
}

.logo-frame img {
  display: block;
  width: 100%;
  height: 100%;

  object-fit: contain;
  border-radius: 50%;
}

/* Subtle leaves unfurl around the approaching emblem. */

.leaf {
  position: absolute;
  z-index: 8;

  width: 14%;
  height: 6%;

  border-radius: 100% 0 100% 0;

  background:
    linear-gradient(
      135deg,
      rgba(179, 202, 119, 0.92),
      rgba(74, 108, 55, 0.88) 60%,
      rgba(23, 47, 29, 0.85)
    );

  opacity: 0;
  transform-origin: left center;

  animation:
    leafUnfurl 6.5s var(--leaf-delay)
    cubic-bezier(0.16, 0.75, 0.2, 1)
    forwards;
}

.leaf-one {
  left: 10%;
  top: 22%;
  --leaf-delay: 2.6s;
  rotate: -38deg;
}

.leaf-two {
  right: 8%;
  top: 31%;
  --leaf-delay: 3.1s;
  rotate: 128deg;
}

.leaf-three {
  right: 12%;
  bottom: 19%;
  --leaf-delay: 3.6s;
  rotate: 35deg;
}

.leaf-four {
  left: 9%;
  bottom: 27%;
  --leaf-delay: 4.1s;
  rotate: 211deg;
}

/* Fade after the third pulse */

.blackout {
  position: absolute;
  inset: 0;
  z-index: 30;

  pointer-events: none;
  background: #000;
  opacity: 0;

  animation: finalBlackout 1.8s 17.15s ease-in-out forwards;
}

/* Welcome screen */

.welcome {
  position: absolute;
  inset: 0;
  z-index: 40;

  display: grid;
  align-content: center;
  justify-items: center;

  padding: 32px;
  text-align: center;

  color: #efe8cf;

  background:
    radial-gradient(
      circle at 50% 47%,
      rgba(77, 107, 57, 0.12),
      transparent 34%
    ),
    #010302;

  opacity: 0;
  visibility: hidden;

  animation: welcomeReveal 1.8s 18.65s ease-out forwards;
}

.welcome-kicker,
.welcome-system,
.welcome-status,
.credential-status {
  text-transform: uppercase;
  font-family: Consolas, "Courier New", monospace;
}

.welcome-kicker {
  margin: 0 0 18px;

  color: rgba(219, 183, 101, 0.76);

  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.42em;
}

.welcome h1 {
  margin: 0;

  color: #f0d58d;

  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(48px, 10vw, 94px);
  font-weight: 600;
  line-height: 0.95;
  letter-spacing: 0.08em;

  text-shadow:
    0 0 38px rgba(219, 183, 101, 0.2),
    0 4px 18px rgba(0, 0, 0, 0.85);
}

.welcome-rule {
  width: min(370px, 72vw);
  height: 1px;
  margin: 33px 0 24px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(219, 183, 101, 0.82),
      transparent
    );

  transform: scaleX(0);

  animation:
    ruleReveal 1.2s 19.4s ease-out forwards;
}

.welcome-system {
  margin: 0;

  color: #efe8cf;

  font-size: clamp(10px, 2.4vw, 13px);
  letter-spacing: 0.22em;
}

.welcome-status {
  display: flex;
  align-items: center;
  gap: 10px;

  margin: 17px 0 0;

  color: #bcd6a9;

  font-size: 9px;
  letter-spacing: 0.18em;
}

.status-dot {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #bcd6a9;

  box-shadow:
    0 0 12px rgba(188, 214, 169, 0.85);

  animation: statusBreathe 2.4s ease-in-out infinite;
}

.credential-status {
  display: flex;
  align-items: center;
  gap: 9px;

  margin: 24px 0 0;

  color: rgba(219, 183, 101, 0.82);

  font-size: 9px;
  letter-spacing: 0.16em;

  opacity: 0;

  animation:
    credentialReveal 0.9s 20.1s ease-out forwards;
}

.credential-check {
  display: grid;
  width: 19px;
  height: 19px;
  place-items: center;

  border:
    1px solid rgba(188, 214, 169, 0.55);

  border-radius: 50%;

  color: #bcd6a9;
  font-size: 11px;

  box-shadow:
    inset 0 0 10px rgba(188, 214, 169, 0.08),
    0 0 14px rgba(188, 214, 169, 0.13);
}

/* Animation timing */

@keyframes starAppear {
  from { opacity: 0; }
  to { opacity: 0.58; }
}

@keyframes starDrift {
  from {
    transform:
      translate3d(0, 2px, 0)
      scale(0.75);
  }

  to {
    transform:
      translate3d(2px, -4px, 0)
      scale(1.12);
  }
}

@keyframes glowAwaken {
  from {
    opacity: 0;
    transform:
      translate(-50%, -50%)
      scale(0.08);
  }

  to {
    opacity: 1;
    transform:
      translate(-50%, -50%)
      scale(1);
  }
}

@keyframes resonanceAppear {
  from {
    opacity: 0;
    transform:
      translate(-50%, -50%)
      scale(0.16);
  }

  to {
    opacity: 0.82;
    transform:
      translate(-50%, -50%)
      scale(1);
  }
}

@keyframes resonanceBreathe {
  from {
    filter: brightness(0.75);
  }

  to {
    filter: brightness(1.18);
  }
}

@keyframes forestEmerge {
  from {
    opacity: 0;
    transform: translateY(4%);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes emblemApproach {
  0% {
    opacity: 0;
    transform:
      translate(-50%, -50%)
      scale(0.035);
    filter: blur(7px);
  }

  14% {
    opacity: 0.48;
  }

  70% {
    opacity: 1;
    filter: blur(1px);
  }

  90% {
    transform:
      translate(-50%, -50%)
      scale(1.025);
    filter: blur(0);
  }

  100% {
    opacity: 1;
    transform:
      translate(-50%, -50%)
      scale(1);
    filter: blur(0);
  }
}

@keyframes logoAwaken {
  from {
    filter:
      brightness(0.35)
      saturate(0.3)
      blur(4px)
      drop-shadow(
        0 0 5px rgba(211, 202, 100, 0)
      );
  }

  to {
    filter:
      brightness(1)
      saturate(1)
      blur(0)
      drop-shadow(
        0 0 25px rgba(211, 202, 100, 0.24)
      );
  }
}

@keyframes emblemPulse {
  0%,
  100% {
    transform: scale(1);
  }

  22% {
    transform: scale(1.1);
  }

  48% {
    transform: scale(1.018);
  }

  63% {
    transform: scale(1.05);
  }
}

@keyframes logoGlowPulse {
  0%,
  100% {
    filter:
      brightness(1)
      saturate(1)
      drop-shadow(
        0 0 25px rgba(211, 202, 100, 0.24)
      );
  }

  22% {
    filter:
      brightness(1.22)
      saturate(1.1)
      drop-shadow(
        0 0 65px rgba(220, 220, 121, 0.62)
      );
  }

  63% {
    filter:
      brightness(1.12)
      saturate(1.05)
      drop-shadow(
        0 0 45px rgba(199, 208, 110, 0.42)
      );
  }
}

@keyframes leafUnfurl {
  0% {
    opacity: 0;
    transform:
      scale(0.04)
      skewX(25deg);
  }

  75% {
    opacity: 0.78;
    transform:
      scale(1.08)
      skewX(-3deg);
  }

  100% {
    opacity: 0.92;
    transform:
      scale(1)
      skewX(0);
  }
}

@keyframes finalBlackout {
  0% {
    opacity: 0;
  }

  55%,
  100% {
    opacity: 1;
  }
}

@keyframes welcomeReveal {
  0% {
    visibility: visible;
    opacity: 0;
    filter: blur(7px);
    transform: scale(0.99);
  }

  100% {
    visibility: visible;
    opacity: 1;
    filter: blur(0);
    transform: scale(1);
  }
}

@keyframes ruleReveal {
  from {
    transform: scaleX(0);
  }

  to {
    transform: scaleX(1);
  }
}

@keyframes statusBreathe {
  50% {
    opacity: 0.45;
    transform: scale(0.86);
  }
}

@keyframes credentialReveal {
  from {
    opacity: 0;
    transform: translateY(5px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 600px) {
  .emblem-flight {
    width: min(88vw, 390px);
  }

  .resonance-field {
    width: 140vw;
  }

  .forest-front .tree {
    width: calc(var(--width) * 0.82);
  }
}

@media (prefers-reduced-motion: reduce) {
  .scene > * {
    animation-duration: 0.01ms !important;
    animation-delay: 0ms !important;
  }

  .welcome {
    visibility: visible;
    opacity: 1;
  }
}
/*
  Painted forest replacement.
  The original generated trees remain preserved but hidden.
*/

.forest {
  display: none;
}

.painted-forest {
  position: absolute;
  inset: 0;
  z-index: 8;

  width: 100%;
  height: 100%;

  object-fit: cover;
  object-position: center bottom;

  pointer-events: none;

  opacity: 0;

  filter:
    brightness(0.58)
    saturate(0.72)
    contrast(1.12)
    drop-shadow(
      0 -2px 8px rgba(181, 198, 101, 0.045)
    );

  transform: scale(1.025);

  animation:
    paintedForestEmerge 8s 0.5s ease-out forwards;
}

@keyframes paintedForestEmerge {
  from {
    opacity: 0;
    transform: scale(1.05) translateY(2%);
    filter:
      brightness(0.28)
      saturate(0.5)
      contrast(1.16);
  }

  to {
    opacity: 1;
    transform: scale(1.025) translateY(0);
    filter:
      brightness(0.58)
      saturate(0.72)
      contrast(1.12)
      drop-shadow(
        0 -2px 8px rgba(181, 198, 101, 0.045)
      );
  }
}
/*
  Organic resonance traces.
  These override the earlier geometrical circle design.
*/

.resonance-field {
  width: min(94vw, 980px);
  height: min(66vw, 690px);
  aspect-ratio: auto;

  border: 1px solid rgba(205, 196, 101, 0.12);

  border-top-color: rgba(221, 211, 122, 0.19);
  border-right-color: rgba(151, 173, 76, 0.04);
  border-bottom-color: rgba(177, 184, 83, 0.09);
  border-left-color: transparent;

  border-radius:
    47% 53% 44% 56%
    /
    58% 43% 57% 42%;

  background: none;

  box-shadow:
    0 0 28px rgba(175, 186, 85, 0.025),
    inset 0 0 32px rgba(175, 186, 85, 0.018);

  filter:
    blur(0.2px)
    drop-shadow(
      0 0 8px rgba(200, 199, 102, 0.06)
    );

  animation:
    organicRingArrival 10s 1s ease-out forwards,
    organicRingDrift 17s 10.5s ease-in-out infinite alternate;
}

.resonance-field::before {
  content: "";

  position: absolute;
  inset: 9% -4% 7% 3%;

  border: 1px solid rgba(181, 190, 91, 0.1);

  border-top-color: transparent;
  border-right-color: rgba(215, 205, 112, 0.15);
  border-bottom-color: rgba(132, 161, 74, 0.055);

  border-radius:
    54% 46% 57% 43%
    /
    42% 59% 41% 58%;

  box-shadow: none;

  transform: rotate(8deg);

  animation:
    middleTraceDrift 13s ease-in-out infinite alternate;
}

.resonance-field::after {
  content: "";

  position: absolute;
  inset: 23% 13% 18% 10%;

  border: 1px solid rgba(211, 202, 103, 0.11);

  border-top-color: rgba(211, 202, 103, 0.16);
  border-right-color: transparent;
  border-bottom-color: rgba(123, 155, 68, 0.045);
  border-left-color: rgba(184, 190, 93, 0.08);

  border-radius:
    43% 57% 48% 52%
    /
    61% 39% 55% 45%;

  transform: rotate(-11deg);

  filter:
    blur(0.15px)
    drop-shadow(
      0 0 7px rgba(207, 199, 103, 0.05)
    );

  animation:
    innerTraceDrift 11s ease-in-out infinite alternate;
}

@keyframes organicRingArrival {
  from {
    opacity: 0;

    transform:
      translate(-50%, -50%)
      scale(0.14)
      rotate(-8deg);

    filter:
      blur(4px)
      brightness(0.6);
  }

  65% {
    opacity: 0.5;
  }

  to {
    opacity: 0.82;

    transform:
      translate(-50%, -50%)
      scale(1)
      rotate(0deg);

    filter:
      blur(0.2px)
      brightness(1);
  }
}

@keyframes organicRingDrift {
  from {
    transform:
      translate(-50%, -50%)
      scaleX(0.985)
      scaleY(1.025)
      rotate(-3deg);
  }

  to {
    transform:
      translate(-50%, -50%)
      scaleX(1.025)
      scaleY(0.98)
      rotate(4deg);
  }
}

@keyframes middleTraceDrift {
  from {
    transform:
      rotate(8deg)
      scaleX(1.015)
      scaleY(0.975);
  }

  to {
    transform:
      rotate(1deg)
      scaleX(0.98)
      scaleY(1.035);
  }
}

@keyframes innerTraceDrift {
  from {
    transform:
      rotate(-11deg)
      scaleX(0.97)
      scaleY(1.03);
  }

  to {
    transform:
      rotate(-3deg)
      scaleX(1.035)
      scaleY(0.975);
  }
}
/*
  Bring the organic resonance traces closer to the emblem.
*/

.resonance-field {
  width: min(68vw, 700px);
  height: min(50vw, 520px);

  border-width: 1px;

  border-top-color: rgba(224, 215, 121, 0.27);
  border-right-color: rgba(153, 178, 81, 0.08);
  border-bottom-color: rgba(183, 191, 93, 0.14);
  border-left-color: rgba(211, 203, 108, 0.055);

  box-shadow:
    0 0 18px rgba(201, 200, 103, 0.045),
    inset 0 0 22px rgba(201, 200, 103, 0.025);
}

.resonance-field::before {
  inset: 11% 5% 8% 2%;

  border-top-color: rgba(195, 201, 100, 0.07);
  border-right-color: rgba(221, 211, 119, 0.22);
  border-bottom-color: rgba(138, 166, 75, 0.08);
  border-left-color: rgba(194, 197, 99, 0.12);
}

.resonance-field::after {
  inset: 24% 17% 19% 13%;

  border-top-color: rgba(222, 212, 116, 0.23);
  border-right-color: rgba(143, 170, 75, 0.05);
  border-bottom-color: rgba(178, 187, 91, 0.1);
  border-left-color: rgba(202, 199, 103, 0.16);
}

/*
  Keep every added leaf and vine behind the logo.
*/

.emblem-pulse {
  isolation: isolate;
}

.logo-frame {
  position: relative;
  z-index: 10;
}

.leaf {
  z-index: 2;

  width: 8%;
  height: 3.8%;

  background:
    linear-gradient(
      135deg,
      rgba(159, 184, 103, 0.86),
      rgba(70, 104, 52, 0.84) 58%,
      rgba(25, 50, 30, 0.8)
    );

  box-shadow:
    0 0 8px rgba(142, 171, 90, 0.08);
}

/* Upper-left foliage */

.leaf-one {
  left: 5%;
  top: 19%;
  rotate: -42deg;
}

.leaf-five {
  left: 1%;
  top: 31%;
  rotate: -18deg;
  --leaf-delay: 3.3s;
}

/* Lower-left foliage */

.leaf-four {
  left: 5%;
  bottom: 22%;
  rotate: 205deg;
}

.leaf-six {
  left: 0%;
  bottom: 35%;
  rotate: 168deg;
  --leaf-delay: 3.9s;
}

/* Upper-right foliage */

.leaf-two {
  right: 4%;
  top: 22%;
  rotate: 132deg;
}

.leaf-seven {
  right: 0%;
  top: 35%;
  rotate: 157deg;
  --leaf-delay: 3.5s;
}

/* Lower-right foliage */

.leaf-three {
  right: 5%;
  bottom: 20%;
  rotate: 38deg;
}

.leaf-eight {
  right: 0%;
  bottom: 33%;
  rotate: 12deg;
  --leaf-delay: 4.1s;
}

/* Smaller leaves near the bottom perimeter */

.leaf-nine {
  left: 24%;
  bottom: 5%;
  rotate: 238deg;
  --leaf-delay: 4.4s;
}

.leaf-ten {
  right: 24%;
  bottom: 5%;
  rotate: -58deg;
  --leaf-delay: 4.6s;
}

/*

/*

.leaf,

/*

  3. Original logo

.emblem-pulse {

}

.foliage-wreath {

/*

*/

.living-ring {
  position: absolute;
  left: 50%;
  top: 50%;

  width: var(--ring-width);
  height: var(--ring-height);

  transform:
    translate(-50%, -50%)
    rotate(var(--ring-angle));

  animation:
    ringDrift var(--drift-time)
    var(--drift-delay)
    ease-in-out
    infinite alternate;
}

.living-ring::before {
  content: "";

  position: absolute;
  inset: 0;

  border: 1px solid rgba(219, 207, 105, 0.11);

  border-top-color:
    rgba(239, 221, 119, var(--top-strength));

  border-right-color:
    rgba(166, 190, 86, var(--right-strength));

  border-bottom-color:
    rgba(213, 201, 101, var(--bottom-strength));

  border-left-color:

  opacity: 0;

  filter:

/*
  Four natural points of concentrated resonance.
*/

.energy-star {
  position: absolute;
  z-index: 2;

  width: 4px;
  height: 4px;

  border-radius: 50%;

  background: #f4df83;

  opacity: 0;

  animation:
    energyPointAppear 7s 3.7s ease-out forwards,
    energyPointSequence 6.45s 10.9s ease-in-out forwards;
}

.energy-star::before,
.energy-star::after {
  content: "";

  position: absolute;
  left: 50%;
  top: 50%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(244, 223, 131, 0.68),
      transparent
    );

  transform: translate(-50%, -50%);
}

.energy-star::before {
  width: 34px;
  height: 1px;
}

.energy-star::after {
  width: 1px;
  height: 34px;
}

.energy-star-top {
  left: 50%;
  top: 7%;
}

.energy-star-bottom {
  left: 50%;
  bottom: 7%;
}

.energy-star-left {
  left: 9%;
  top: 50%;
}

.energy-star-right {
  right: 9%;
  top: 50%;
}

/*
  The wreath grows once, then responds to three increasingly
  powerful pulses.
*/

@keyframes wreathGrow {
  0% {
    opacity: 0;

    transform:
      translate(-50%, -50%)
      scale(0.46)
      rotate(-3deg);

    filter:
      brightness(0.28)
      saturate(0.48)
      blur(2px);
  }

  38% {
    opacity: 0.24;
  }

  72% {
    opacity: 0.72;

    transform:
      translate(-50%, -50%)
      scale(0.93)
      rotate(1deg);

    filter:
      brightness(0.62)
      saturate(0.76)
      blur(0.5px);
  }

  100% {
    opacity: 0.92;

    transform:
      translate(-50%, -50%)
      scale(1)
      rotate(0deg);

    filter:
      brightness(0.76)
      saturate(0.85)
      blur(0)
      drop-shadow(
        0 0 10px rgba(173, 190, 92, 0.09)
      );
  }
}

@keyframes wreathPulseSequence {
  /* Resting after growth */
  0% {
    filter:
      brightness(0.76)
      saturate(0.85)
      drop-shadow(
        0 0 10px rgba(173, 190, 92, 0.09)
      );
  }

  /* First pulse */
  10% {
    filter:
      brightness(0.98)
      saturate(1)
      drop-shadow(
        0 0 22px rgba(207, 205, 105, 0.24)
      );
  }

  24% {
    filter:
      brightness(0.79)
      saturate(0.88)
      drop-shadow(
        0 0 12px rgba(173, 190, 92, 0.11)
      );
  }

  /* Second pulse */
  43% {
    filter:
      brightness(1.12)
      saturate(1.06)
      drop-shadow(
        0 0 32px rgba(221, 213, 111, 0.36)
      );
  }

  57% {
    filter:
      brightness(0.82)
      saturate(0.9)
      drop-shadow(
        0 0 14px rgba(173, 190, 92, 0.13)
      );
  }

  /* Final pulse */
  77% {
    filter:
      brightness(1.34)
      saturate(1.13)
      drop-shadow(
        0 0 48px rgba(238, 222, 123, 0.52)
      );
  }

  100% {
    filter:
      brightness(1.02)
      saturate(1)
      drop-shadow(
        0 0 27px rgba(218, 210, 107, 0.3)
      );
  }
}

/*
  Each ring appears independently, giving the approach
  scene its layered depth.
*/

@keyframes ringMaterialize {
  0% {
    opacity: 0;

    transform:
      scale(0.42)
      rotate(-7deg);

    filter:
      blur(3px)
      brightness(0.5);
  }

  48% {
    opacity: 0.17;
  }

  100% {
    opacity: 0.72;

    transform:
      scale(1)
      rotate(0deg);

    filter:
      blur(0.15px)
      brightness(1);
  }
}

@keyframes ringDrift {
  from {
    transform:
      translate(-50%, -50%)
      rotate(var(--ring-angle))
      scaleX(0.975)
      scaleY(1.025);
  }

  to {
    transform:
      translate(-50%, -50%)
      rotate(calc(var(--ring-angle) + 7deg))
      scaleX(1.035)
      scaleY(0.98);
  }
}

/*
  Three peaks increase in strength instead of repeating
  the exact same pulse.
*/

@keyframes ringPulseSequence {
  0% {
    opacity: 0.72;

    filter:
      brightness(1)
      drop-shadow(
        0 0 4px rgba(229, 216, 111, 0.08)
      );
  }

  /* First pulse */
  10% {
    opacity: 0.88;

    filter:
      brightness(1.48)
      drop-shadow(
        0 0 11px rgba(237, 220, 117, 0.36)
      );
  }

  24% {
    opacity: 0.68;
    filter: brightness(1.04);
  }

  /* Second pulse */
  43% {
    opacity: 0.96;

    filter:
      brightness(1.86)
      drop-shadow(
        0 0 17px rgba(241, 224, 122, 0.5)
      );
  }

  57% {
    opacity: 0.72;
    filter: brightness(1.08);
  }

  /* Final pulse */
  77% {
    opacity: 1;

    filter:
      brightness(2.35)
      drop-shadow(
        0 0 25px rgba(249, 229, 130, 0.72)
      );
  }

  100% {
    opacity: 0.92;

    filter:
      brightness(1.45)
      drop-shadow(
        0 0 14px rgba(240, 222, 119, 0.42)
      );
  }
}

@keyframes energyPointAppear {
  from {
    opacity: 0;
    transform: scale(0.1);
  }

  to {
    opacity: 0.68;
    transform: scale(1);
  }
}

@keyframes energyPointSequence {
  0% {
    opacity: 0.68;
    transform: scale(1);
  }

  10% {
    opacity: 0.9;
    transform: scale(1.45);
  }

  24% {
    opacity: 0.68;
    transform: scale(1);
  }

  43% {
    opacity: 1;
    transform: scale(1.9);
  }

  57% {
    opacity: 0.72;
    transform: scale(1.05);
  }

  77% {
    opacity: 1;
    transform: scale(2.5);
  }

  100% {
    opacity: 0.92;
    transform: scale(1.6);
  }
}
/*
  Correct the layer order.

  Forest: background
  Wreath: middle
  Energy traces: around and partly above the foliage
  Original logo: always on top
*/

.painted-forest {
  z-index: 3;

  filter:
    brightness(0.42)
    saturate(0.64)
    contrast(1.14);
}

.emblem-flight {
  z-index: 9;
}

.foliage-wreath {
  z-index: 6;
}

/*
  The earlier -56% inset made the ring container enormous.
  Reset it to the exact size of the emblem system.
*/

.living-rings {
  inset: 0;
  z-index: 7;
}

.logo-frame {
  z-index: 10;
}

/*
  Make the resonance traces visible without making them
  look like solid mechanical bands.
*/

.living-ring::before {
  border-width: 1.35px;

  filter:
    brightness(1.75)
    blur(0.1px)
    drop-shadow(
      0 0 7px rgba(239, 223, 122, 0.23)
    );
}

/*
  Strengthen their resting appearance after they materialize.
*/

@keyframes ringMaterialize {
  0% {
    opacity: 0;

    transform:
      scale(0.42)
      rotate(-7deg);

    filter:
      blur(3px)
      brightness(0.5);
  }

  48% {
    opacity: 0.28;
  }

  100% {
    opacity: 0.9;

    transform:
      scale(1)
      rotate(0deg);

    filter:
      blur(0.1px)
      brightness(1.5);
  }
}

/*
  Bring the four energy points forward with the rings,
  but keep them beneath the original logo.
*/

.energy-star {
  z-index: 8;
}
/*
  New resonance system:
  fine organic halos, wide orbits, and progressive illumination.
*/

.living-rings {
  position: absolute;
  left: 50%;
  top: 50%;
  z-index: 7;

  width: 190%;
  height: 190%;

  transform: translate(-50%, -50%);
  pointer-events: none;
  overflow: visible;
}

.resonance-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;

  opacity: 0;

  animation:
    resonanceApproach 9.8s 0.8s ease-out forwards,
    resonancePulseSequence 6.45s 10.9s ease-in-out forwards;
}

/*
  Broken strokes keep the currents from looking like
  perfect computer-generated circles.
*/

.resonance-halo ellipse,
.resonance-orbits ellipse {
  fill: none;
  vector-effect: non-scaling-stroke;
  stroke-linecap: round;

  filter:
    url("#organicResonance")
    url("#resonanceGlow");
}

.resonance-halo ellipse {
  stroke: rgba(231, 217, 112, 0.6);
  stroke-width: 1.25;

  stroke-dasharray:
    2 7
    16 5
    3 11
    27 8;

  stroke-dashoffset: 0;
}

/* Slight variations prevent repeated mechanical spacing. */

.resonance-halo ellipse:nth-child(2n) {
  stroke: rgba(177, 196, 90, 0.48);
  stroke-dasharray:
    11 6
    2 9
    22 5
    4 13;
}

.resonance-halo ellipse:nth-child(3n) {
  stroke: rgba(247, 226, 117, 0.52);
  stroke-width: 0.9;
  stroke-dasharray:
    3 5
    31 9
    2 12;
}

/*
  The two halo layers drift against one another.
*/

.resonance-halo-a {
  transform-origin: 500px 500px;

  animation:
    haloTurnClockwise 22s 1.2s linear infinite;
}

.resonance-halo-b {
  transform-origin: 500px 500px;

  opacity: 0.72;

  transform:
    rotate(4deg)
    scaleX(1.025)
    scaleY(0.98);

  animation:
    haloTurnCounterclockwise 29s 1.2s linear infinite;
}

/*
  Wide elliptical currents create the sweeping movement
  visible in the reference images.
*/

.resonance-orbits {
  transform-origin: 500px 500px;

  animation:
    orbitFieldDrift 15s 1.2s ease-in-out infinite alternate;
}

.resonance-orbits ellipse {
  stroke: rgba(242, 226, 113, 0.76);
  stroke-width: 1.7;

  stroke-dasharray:
    4 8
    42 7
    2 12
    24 6;
}

.orbit-one {
  transform-origin: 500px 500px;
  transform: rotate(-4deg);
}

.orbit-two {
  transform-origin: 500px 500px;
  transform: rotate(5deg);
  opacity: 0.76;
}

.orbit-three {
  transform-origin: 500px 500px;
  transform: rotate(-10deg);
  opacity: 0.58;
}

.orbit-four {
  transform-origin: 500px 500px;
  transform: rotate(11deg);
  opacity: 0.48;
}

/*
  Four points anchor the energy field without changing
  or covering the original emblem.
*/

.resonance-points circle {
  fill: url("#energyPoint");
  filter: url("#resonanceGlow");

  transform-box: fill-box;
  transform-origin: center;

  animation:
    resonancePointBreathe 2.8s ease-in-out infinite;
}

.resonance-points circle:nth-child(2) {
  animation-delay: 0.35s;
}

.resonance-points circle:nth-child(3) {
  animation-delay: 0.7s;
}

.resonance-points circle:nth-child(4) {
  animation-delay: 1.05s;
}

@keyframes resonanceApproach {
  0% {
    opacity: 0;

    transform:
      scale(0.42)
      rotate(-3deg);

    filter:
      brightness(0.45)
      blur(2.6px);
  }

  28% {
    opacity: 0.28;
  }

  64% {
    opacity: 0.62;

    filter:
      brightness(0.9)
      blur(0.65px);
  }

  100% {
    opacity: 0.88;

    transform:
      scale(1)
      rotate(0deg);

    filter:
      brightness(1.18)
      blur(0);
  }
}

@keyframes haloTurnClockwise {
  from {
    transform:
      rotate(-4deg)
      scaleX(1.018)
      scaleY(0.984);
  }

  to {
    transform:
      rotate(356deg)
      scaleX(0.988)
      scaleY(1.016);
  }
}

@keyframes haloTurnCounterclockwise {
  from {
    transform:
      rotate(364deg)
      scaleX(1.025)
      scaleY(0.98);
  }

  to {
    transform:
      rotate(4deg)
      scaleX(0.985)
      scaleY(1.02);
  }
}

@keyframes orbitFieldDrift {
  from {
    transform:
      rotate(-3deg)
      scaleX(0.97)
      scaleY(1.035);
  }

  to {
    transform:
      rotate(4deg)
      scaleX(1.04)
      scaleY(0.975);
  }
}

@keyframes resonancePointBreathe {
  0%,
  100% {
    opacity: 0.46;
    transform: scale(0.55);
  }

  50% {
    opacity: 1;
    transform: scale(1.35);
  }
}

/*
  Three increasingly powerful pulses.
*/

@keyframes resonancePulseSequence {
  0% {
    opacity: 0.88;
    filter: brightness(1.18);
  }

  /* First pulse */
  10% {
    opacity: 1;

    filter:
      brightness(1.75)
      drop-shadow(
        0 0 10px rgba(239, 222, 112, 0.42)
      );
  }

  24% {
    opacity: 0.86;
    filter: brightness(1.2);
  }

  /* Second pulse */
  43% {
    opacity: 1;

    filter:
      brightness(2.3)
      drop-shadow(
        0 0 18px rgba(244, 225, 118, 0.62)
      );
  }

  57% {
    opacity: 0.9;
    filter: brightness(1.35);
  }

  /* Final pulse */
  77% {
    opacity: 1;

    filter:
      brightness(3.15)
      drop-shadow(
        0 0 30px rgba(255, 235, 134, 0.88)
      );
  }

  100% {
    opacity: 1;

    filter:
      brightness(2)
      drop-shadow(
        0 0 18px rgba(247, 227, 124, 0.64)
      );
  }
}
/*

*/

.living-rings {

  top: 50%;
  z-index: 4;

.resonance-halo-a ellipse:nth-child(2),
.resonance-halo-a ellipse:nth-child(6),
.resonance-halo-a ellipse:nth-child(9),
.resonance-halo-b ellipse:nth-child(2),
.resonance-halo-b ellipse:nth-child(5) {
  opacity: 0.16;
}

/*
  Distort the rings individually.
  They share a center, but they do not share perfect geometry.
*/

.resonance-halo-a ellipse:nth-child(1) {
  transform-origin: 500px 500px;
  transform: rotate(-5deg) scaleX(1.025) scaleY(0.97);
}

.resonance-halo-a ellipse:nth-child(3) {
  transform-origin: 500px 500px;
  transform: rotate(4deg) scaleX(0.97) scaleY(1.035);
}

.resonance-halo-a ellipse:nth-child(4) {
  transform-origin: 500px 500px;
  transform: rotate(-2deg) scaleX(1.045) scaleY(0.985);
}

.resonance-halo-a ellipse:nth-child(5) {
  transform-origin: 500px 500px;
  transform: rotate(7deg) scaleX(0.985) scaleY(1.025);
}

.resonance-halo-a ellipse:nth-child(7) {
  transform-origin: 500px 500px;
  transform: rotate(-8deg) scaleX(1.03) scaleY(0.96);
}

.resonance-halo-a ellipse:nth-child(8) {
  transform-origin: 500px 500px;
  transform: rotate(3deg) scaleX(0.965) scaleY(1.04);
}

.resonance-halo-a ellipse:nth-child(10) {
  transform-origin: 500px 500px;
  transform: rotate(-4deg) scaleX(1.04) scaleY(0.98);
}

.resonance-halo-a ellipse:nth-child(11) {
  transform-origin: 500px 500px;
  transform: rotate(6deg) scaleX(0.98) scaleY(1.025);
}

/*
  The secondary field becomes faint background texture,
  not another obvious row of circles.
*/

.resonance-halo-b {
  opacity: 0.28;
}

/*
  Preserve the sweeping elliptical movement, but make the
  orbits slender, golden-green, and irregular.
*/

.resonance-orbits ellipse {
  stroke: rgba(218, 211, 101, 0.42);
  stroke-width: 0.95;

  stroke-dasharray:
    2 15
    68 18
    3 26
    31 21;

  filter:
    url("#organicResonance")
    drop-shadow(
      0 0 4px rgba(206, 211, 99, 0.18)
    );
}

.orbit-two {
  opacity: 0.52;
}

.orbit-three {
  opacity: 0.34;
}

.orbit-four {
  opacity: 0.22;
}

/*
  Smaller, warmer energy points.
*/

.resonance-points circle {
  opacity: 0.45;
  transform: scale(0.62);
}

/*
  Dimmer approach.
*/

@keyframes resonanceApproach {
  0% {
    opacity: 0;

    transform:
      scale(0.48)
      rotate(-2deg);

    filter:
      brightness(0.42)
      blur(2px);
  }

  35% {
    opacity: 0.16;
  }

  68% {
    opacity: 0.38;

    filter:
      brightness(0.72)
      blur(0.45px);
  }

  100% {
    opacity: 0.58;

    transform:
      scale(1)
      rotate(0deg);

    filter:
      brightness(0.9)
      blur(0);
  }
}

/*
  The pulses intensify without bleaching the rings white.
*/

@keyframes resonancePulseSequence {
  0% {
    opacity: 0.58;
    filter: brightness(0.9);
  }

  /* First pulse */
  10% {
    opacity: 0.7;

    filter:
      brightness(1.18)
      sepia(0.18)
      drop-shadow(
        0 0 6px rgba(211, 210, 101, 0.25)
      );
  }

  24% {
    opacity: 0.53;
    filter: brightness(0.86);
  }

  /* Second pulse */
  43% {
    opacity: 0.78;

    filter:
      brightness(1.38)
      sepia(0.22)
      drop-shadow(
        0 0 10px rgba(222, 215, 105, 0.34)
      );
  }

  57% {
    opacity: 0.58;
    filter: brightness(0.93);
  }

  /* Final pulse */
  77% {
    opacity: 0.9;

    filter:
      brightness(1.72)
      sepia(0.26)
      drop-shadow(
        0 0 16px rgba(231, 219, 112, 0.48)
      );
  }

  100% {
    opacity: 0.68;

    filter:
      brightness(1.1)
      sepia(0.14)
      drop-shadow(
        0 0 8px rgba(217, 212, 104, 0.28)
      );
  }
}
/*
  Transition from credential verification
  into Headquarters biometric calibration.
*/

.calibration-launch {
  position: relative;

  margin-top: 34px;
  padding: 15px 25px;

  color: rgba(238, 232, 207, 0.9);

  border:
    1px solid rgba(152, 174, 103, 0.44);

  background:
    linear-gradient(
      135deg,
      rgba(17, 34, 21, 0.86),
      rgba(3, 11, 6, 0.94)
    );

  box-shadow:
    inset 0 0 0 1px rgba(221, 208, 111, 0.035),
    0 0 18px rgba(95, 128, 70, 0.08);

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;

  cursor: pointer;

  opacity: 0;

  animation:
    calibrationControlReveal
    1.1s
    20.6s
    ease-out
    forwards;

  transition:
    border-color 240ms ease,
    color 240ms ease,
    box-shadow 240ms ease,
    transform 240ms ease;
}

.calibration-launch::before,
.calibration-launch::after {
  content: "";

  position: absolute;

  width: 8px;
  height: 8px;

  pointer-events: none;
}

.calibration-launch::before {
  left: -1px;
  top: -1px;

  border-left:
    1px solid rgba(223, 207, 111, 0.86);

  border-top:
    1px solid rgba(223, 207, 111, 0.86);
}

.calibration-launch::after {
  right: -1px;
  bottom: -1px;

  border-right:
    1px solid rgba(223, 207, 111, 0.86);

  border-bottom:
    1px solid rgba(223, 207, 111, 0.86);

.calibration-launch:hover {

}

@keyframes calibrationControlReveal {

/*

<script>
/*
  A seeded number generator makes the forest and stars appear
  in the same positions every time the page loads.
*/

function seededRandom(seed) {
  let value = seed % 2147483647;

  return function () {
    value = value * 16807 % 2147483647;
    return (value - 1) / 2147483646;
  };
}

const random = seededRandom(143);

/* Create sparse golden stars and fireflies. */

const starField = document.getElementById("starField");

for (let index = 0; index < 74; index += 1) {
  const star = document.createElement("span");

  star.className = "star";

  star.style.setProperty("--x", `${random() * 100}%`);
  star.style.setProperty("--y", `${random() * 86}%`);
  star.style.setProperty("--size", `${0.7 + random() * 2.2}px`);
  star.style.setProperty("--delay", `${random() * 5}s`);
  star.style.setProperty("--duration", `${4 + random() * 5}s`);

  starField.appendChild(star);
}

/*
  Tree height increases toward both outer edges.
  This creates a low central horizon that naturally
  frames the distant emblem.
*/

function createForest(containerId, count, minimumHeight, maximumHeight, isFront) {
  const forest = document.getElementById(containerId);

  for (let index = 0; index < count; index += 1) {
    const tree = document.createElement("span");

    const position = index / (count - 1);
    const distanceFromCenter = Math.abs(position - 0.5) * 2;
    const shapedDistance = Math.pow(distanceFromCenter, 1.45);

    const baseHeight =
      minimumHeight +
      shapedDistance * (maximumHeight - minimumHeight);

    const heightVariation = (random() - 0.5) * 11;
    const finalHeight = baseHeight + heightVariation;

    const baseWidth = isFront ? 86 : 61;
    const widthVariation = random() * (isFront ? 54 : 35);

    tree.className = "tree";

    tree.style.left = `${position * 106 - 3}%`;
    tree.style.setProperty("--height", `${finalHeight}%`);
    tree.style.setProperty("--width", `${baseWidth + widthVariation}px`);
    tree.style.setProperty("--lean", `${0.88 + random() * 0.28}`);

    forest.appendChild(tree);
  }
}

createForest("forestBack", 37, 20, 66, false);
createForest("forestFront", 27, 29, 103, true);
const calibrationLaunch =
  document.getElementById("beginProfileCalibration");

calibrationLaunch.addEventListener("click", () => {
  document
    .querySelector(".welcome")
    .classList.add("is-departing");

  window.setTimeout(() => {
    window.location.href =
      "agent-profile-calibration.html?from=onboarding";
  }, 700);
});
</script>
