<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operation Echo Field Terminal</title>

<style>
* {
box-sizing: border-box;
}

html,
body {
margin: 0;
width: 100%;
min-height: 100%;
}

body {
min-height: 100vh;
display: grid;
place-items: center;
overflow: hidden;
padding: 24px;

background:
radial-gradient(circle at 50% 42%, rgba(95, 150, 82, 0.22), transparent 34%),
linear-gradient(145deg, #050e08, #0d2012 55%, #040b07);

color: #efe9d3;
font-family: "Segoe UI", Arial, sans-serif;
}

body::before {
content: "";
position: fixed;
inset: 0;
pointer-events: none;

background:
repeating-linear-gradient(
0deg,
rgba(255, 255, 255, 0.018) 0,
rgba(255, 255, 255, 0.018) 1px,
transparent 1px,
transparent 4px
);
}

body::after {
content: "";
position: fixed;
inset: 0;
pointer-events: none;
box-shadow: inset 0 0 160px 50px rgba(0, 0, 0, 0.86);
}

.terminal {
position: relative;
width: min(720px, 92vw);
padding: 76px 36px 64px;
text-align: center;

background:
linear-gradient(
145deg,
rgba(34, 59, 35, 0.75),
rgba(10, 24, 14, 0.9)
);

border: 1px solid rgba(219, 183, 101, 0.55);
border-radius: 6px;

box-shadow:
0 30px 90px rgba(0, 0, 0, 0.7),
inset 0 0 55px rgba(102, 157, 86, 0.09);

animation: terminalArrival 1.3s ease-out both;
}

.terminal::before {
content: "";
position: absolute;
inset: 12px;
border: 1px solid rgba(219, 183, 101, 0.2);
pointer-events: none;
}

.system-label {
position: absolute;
top: 24px;
left: 50%;
transform: translateX(-50%);
width: max-content;
max-width: 82%;

color: rgba(224, 196, 127, 0.78);
font-size: 11px;
font-weight: 700;
letter-spacing: 3px;
}

.emblem {
width: 92px;
height: 92px;
display: grid;
place-items: center;
margin: 0 auto 26px;

border: 1px solid rgba(219, 183, 101, 0.6);
border-radius: 50%;

color: #dbb765;
font-family: Georgia, serif;
font-size: 30px;
font-weight: 700;

box-shadow:
0 0 28px rgba(219, 183, 101, 0.15),
inset 0 0 22px rgba(219, 183, 101, 0.08);
}

h1 {
margin: 0 0 28px;

color: #dbb765;
font-family: Georgia, "Times New Roman", serif;
font-size: clamp(34px, 7vw, 62px);
letter-spacing: clamp(4px, 1.2vw, 10px);
line-height: 1.05;

text-shadow:
0 0 18px rgba(219, 183, 101, 0.25),
0 3px 12px rgba(0, 0, 0, 0.8);
}

.headquarters {
margin-bottom: 8px;

color: #9cc38a;
font-size: 13px;
font-weight: 700;
letter-spacing: 4px;
}

.department {
margin-bottom: 46px;

color: #f4eed7;
font-family: Georgia, "Times New Roman", serif;
font-size: clamp(19px, 3vw, 26px);
}

.status {
display: inline-block;
min-width: min(440px, 80vw);
padding: 17px 22px;

background: rgba(2, 10, 5, 0.62);
border: 1px solid rgba(126, 185, 112, 0.36);

color: #9fd391;
font-family: Consolas, "Courier New", monospace;
font-size: clamp(14px, 2.5vw, 18px);
letter-spacing: 1px;

box-shadow:
inset 0 0 20px rgba(83, 164, 69, 0.08),
0 0 25px rgba(83, 164, 69, 0.08);
}

.cursor {
display: inline-block;
width: 8px;
height: 1em;
margin-left: 8px;
vertical-align: -2px;

background: #9fd391;
box-shadow: 0 0 8px rgba(159, 211, 145, 0.8);

animation: cursorBlink 0.9s steps(1) infinite;
}

@keyframes terminalArrival {
from {
opacity: 0;
transform: scale(0.96) translateY(16px);
filter: blur(5px);
}

to {
opacity: 1;
transform: scale(1) translateY(0);
filter: blur(0);
}
}

@keyframes cursorBlink {
50% {
opacity: 0;
}
}

@media (max-width: 520px) {
body {
padding: 14px;
}

.terminal {
padding: 70px 20px 52px;
}

.status {
min-width: 100%;
}
}
.emblem-logo {
display: block;
width: 150px;
height: 150px;
margin: 0 auto 28px;
object-fit: contain;
border-radius: 50%;
filter:
drop-shadow(0 0 20px rgba(219, 183, 101, 0.22))
drop-shadow(0 12px 26px rgba(0, 0, 0, 0.5));
}
</style>
</head>

<body>
<main class="terminal">
<div class="system-label">
NPD FIELD TERMINAL • SECURE CONNECTION
</div>

<img class="emblem-logo" src="assets/logo/logo.png" alt="Operation Echo">

<h1>OPERATION ECHO</h1>

<div class="headquarters">
CHEESE HEADQUARTERS
</div>

<div class="department">
Nature Preservation Department
</div>

<div class="status">
<span id="statusText">Initializing Field Terminal...</span>
<span class="cursor"></span>
</div>
</main>

<script>
const messages = [
"Initializing Field Terminal...",
"Calibrating Temporal Sensors...",
"Environmental Memory Detected.",
"The Echo is responding."
];

let messageIndex = 0;
const statusText = document.getElementById("statusText");

setInterval(() => {
messageIndex = (messageIndex + 1) % messages.length;
statusText.textContent = messages[messageIndex];
}, 2200);
</script>
</body>
</html>
